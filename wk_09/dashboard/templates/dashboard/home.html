{% load static %}
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perceptron Dashboard - DL69 Week 09</title>
    <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="header">
            <div>รหัสนักศึกษา: <strong id="studentId">67114540116</strong></div>
            <div>ชื่อ-นามสกุล: <strong id="studentName">ชานนท์ สายแจ้</strong></div>
        </div>

        <div class="controls">
            <button id="btnStart" class="btn" onclick="startTraining()">เริ่มฝึกสอน</button>
        </div>

        <div class="canvas-wrapper">
            <canvas id="cv" width="400" height="400"></canvas>
        </div>

        <div class="metrics">
            <div>Epoch: <span id="valEpoch">0 / 200</span></div>
            <div>Loss: <span id="valLoss">0.0000</span></div>
            <div>Accuracy: <span id="valAcc">0.0%</span></div>
        </div>

        <!-- ผลลัพธ์หลังฝึกเสร็จ -->
        <div id="results" class="results-section" style="display: none;">
            <h3>ผลการทดลองเปรียบเทียบ 3 Learning Rates</h3>
            
            <table class="lr-table">
                <thead>
                    <tr>
                        <th>Learning Rate (LR)</th>
                        <th>Final Loss</th>
                        <th>Final Accuracy</th>
                    </tr>
                </thead>
                <tbody id="lrTableBody">
                    <!-- จะถูกเติมข้อมูลโดย JS -->
                </tbody>
            </table>

            <div class="curve-wrapper">
                <h4>Loss Curve Comparison (PNG)</h4>
                <img id="lossCurveImg" src="{% static 'dashboard/loss_curve.png' %}" alt="Loss Curve">
            </div>
        </div>
    </div>

    <script src="{% static 'dashboard/js/main.js' %}"></script>
</body>
</html>
